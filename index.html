<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월 매출 1억 사무실</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#eef0f5; --panel:#ffffff; --line:#e3e6ee; --text:#23263a; --sub:#7b8098;
    --accent:#5b5bd6; --accent-soft:#ecebff; --green:#22a06b; --red:#e5484d; --amber:#f5a524;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:#fff;font-weight:600}
  button.ghost{background:#f1f2f7;color:var(--text)}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none;background:#fff;color:var(--text)}
  input:focus,textarea:focus{border-color:var(--accent)}
  .hidden{display:none!important}

  /* 입장 화면 */
  #join{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#eef0ff,#f7f1ff);z-index:50}
  #join .card{width:380px;background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(60,60,120,.15)}
  #join h1{margin:0 0 4px;font-size:22px}
  #join p{margin:0 0 20px;color:var(--sub)}
  #join label{display:block;font-weight:600;margin:14px 0 6px;font-size:13px}
  .row{display:flex;gap:8px}
  .row button{flex:none;white-space:nowrap}
  .row input{min-width:0}
  .swatches{display:flex;gap:8px}
  .swatches i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .swatches i.on{box-shadow:0 0 0 2px var(--text)}
  #join .go{width:100%;margin-top:22px;padding:12px;font-size:15px}
  #join small{display:block;margin-top:12px;color:var(--sub);line-height:1.5}

  /* 앱 */
  #app{height:100%;display:grid;grid-template-rows:54px 1fr}
  header{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{font-size:16px}
  header .clock{color:var(--sub);font-variant-numeric:tabular-nums}
  header .sp{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#f1f2f7;font-size:13px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:#b9bdcc}
  .dot.on{background:var(--green)} .dot.work{background:var(--accent)} .dot.off{background:var(--amber)} .dot.rest{background:#12a594}
  .chip{font-variant-numeric:tabular-nums}
  .net{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1;text-align:right}
  .net.rest{color:#12a594}
  .netsub{color:var(--sub);font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .netsub.week{text-align:right}
  main{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0}
  aside{background:var(--panel);overflow:auto;padding:16px}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
  h3 span{font-weight:500;color:var(--sub);font-size:12px}
  .box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .todo{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .todo:last-child{border-bottom:0}
  .todo input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--accent);flex:none}
  .todo .t{flex:1;word-break:break-word;line-height:1.45}
  .todo.done .t{color:var(--sub);text-decoration:line-through}
  .todo .x{background:none;color:#b9bdcc;padding:0 4px;font-size:16px}
  .todo .x:hover{color:var(--red)}
  .empty{color:var(--sub);font-size:13px;padding:6px 0}
  .wrap{margin-top:10px;padding:10px;background:#f7f7fb;border-radius:10px;font-size:13px;white-space:pre-wrap;line-height:1.5}
  .wrap b{display:block;margin-bottom:4px;font-size:12px;color:var(--sub)}

  .stage{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:12px}
  #scene{grid-column:1/3;grid-row:1;min-width:0;height:230px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#f4f2ed}
  canvas{display:block}
  .seat{grid-row:2;min-width:0;min-height:0;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
  #meSeat{grid-column:1} #pSeat{grid-column:2}
  .shead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 14px;padding:12px 18px 12px;border-top:5px solid var(--c,var(--accent));border-bottom:1px solid var(--line)}
  .who{display:flex;align-items:center;gap:9px;font-size:19px;min-width:0}
  .who .dot{width:12px;height:12px;background:var(--c,var(--accent));flex:none}
  .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
  .pill{font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px;background:#eef0f5;color:#7b8098;white-space:nowrap}
  .pill.work{background:#ecebff;color:#4747c2} .pill.rest{background:#d9f3ee;color:#0b7a6e} .pill.off{background:#fff3d6;color:#a56a00}
  .sbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .sec{min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px 16px}
  .sec.todos{grid-row:1/3;border-right:1px solid var(--line)}
  .sec.goal{border-top:1px solid var(--line)}
  .sec .list{flex:1;min-height:0;overflow:auto}
  .goal textarea{flex:1;min-height:0;resize:none;font-size:15px;line-height:1.55}
  .gtext{white-space:pre-wrap;font-size:15px;line-height:1.55;word-break:break-word}
  @media (max-width:1500px){
    .sbody{display:block;overflow:auto}
    .sec{border-top:1px solid var(--line)} .sec.todos{border-right:0;border-top:0}
    .sec .list{overflow:visible} .goal textarea{min-height:96px}
  }
  @media (max-width:1250px){ .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 270px} }
  .bar{grid-column:1/4;grid-row:3;justify-self:center;position:relative;display:flex;gap:8px;padding:8px;background:#fff;border-radius:16px;border:1px solid var(--line)}
  .bar button{background:#f1f2f7;color:var(--text);padding:10px 14px;white-space:nowrap}
  .bar button.on{background:#dff5ea;color:#12734b}
  .bar button.in{background:var(--accent);color:#fff}
  .bar button.out{background:var(--text);color:#fff}
  .bar .grp{display:flex;gap:2px}
  .bar .grp button:first-child{border-radius:10px 4px 4px 10px}
  .bar .grp .pick{padding:10px 9px;border-radius:4px 10px 10px 4px}
  .bar .menu{position:absolute;bottom:calc(100% + 8px);left:0;min-width:260px;max-width:360px;max-height:62vh;overflow:auto;background:#fff;border-radius:14px;padding:8px;box-shadow:0 8px 30px rgba(40,40,90,.22)}
  .bar .menu b{display:block;font-size:12px;color:var(--sub);padding:4px 8px 6px}
  .bar .menu button{display:block;width:100%;text-align:left;background:none;font-weight:500;padding:9px 10px;white-space:normal}
  .bar .menu button:hover{background:#f1f2f7}
  .bar .menu button.cur{color:var(--accent);font-weight:700}
  .bar .sep{width:1px;background:var(--line);margin:4px 2px}
  .hint{position:absolute;left:24px;top:22px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:99px}

  .tile{position:relative;background:#14151f;border-radius:12px;overflow:hidden;aspect-ratio:16/10;cursor:zoom-in;flex:none}
  .tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile.screen video{object-fit:contain}
  .tile.mirror video{transform:scaleX(-1)}
  .tile span{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:7px}
  .tile.big{position:fixed;inset:4vh 4vw;z-index:40;aspect-ratio:auto;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(10,10,25,.7)}
  .tile.big video{object-fit:contain}
  aside.right{overflow:hidden;padding:12px}
  #tiles{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}
  .slot{position:relative;border-radius:12px;background:#eceef4;border:1px dashed #cfd3e2;display:grid;place-items:center;color:var(--sub);font-size:12px;min-height:0;overflow:hidden}
  .slot .tile:not(.big){position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
  .badges{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
  .badges span{font-size:12px;font-weight:700;font-style:normal;padding:4px 9px;border-radius:8px;background:rgba(35,38,58,.62);color:#d5d8e4}
  .badges span.on{background:#22a06b;color:#fff}
  .badges span.share{background:var(--accent);color:#fff}
  .bar .menu small{color:var(--sub);font-weight:400;margin-left:6px;font-size:11px}
  .ui{display:flex;gap:6px;align-items:flex-start;font-size:15px;line-height:1.45;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ui:last-child{border-bottom:0}
  .ui span{flex:1;word-break:break-word}
  .ui button{padding:1px 9px;background:var(--accent-soft);color:var(--accent);border-radius:6px;font-size:13px;flex:none}
  .chat{grid-column:3;grid-row:1/3;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .chat h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
  #chatList{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:7px;font-size:15px}
  .msg{max-width:88%;padding:7px 10px;border-radius:12px;background:#f1f2f7;align-self:flex-start;word-break:break-word;white-space:pre-wrap;line-height:1.4}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff}
  .msg small{display:block;font-size:10px;opacity:.65;margin-top:2px}
  .daysep{align-self:center;font-size:11px;color:var(--sub);margin:4px 0}
  .chat .row{padding:10px;border-top:1px solid var(--line)}
  .novideo{color:var(--sub);font-size:13px;line-height:1.6}

  /* 모달 */
  .modal{position:fixed;inset:0;background:rgba(20,20,40,.45);display:grid;place-items:center;z-index:45}
  .modal .card{width:min(560px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:18px;padding:24px}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal p{margin:0 0 14px;color:var(--sub)}
  .modal textarea{min-height:120px;resize:vertical;margin-top:6px}
  .modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .day{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .day h4{margin:0 0 10px;font-size:14px}
  .day .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .day .who{font-weight:700;margin-bottom:4px}
  .day .time{color:var(--sub);font-size:12px;margin-bottom:6px}
  .day ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
  .day li.done{color:var(--sub);text-decoration:line-through}

  #toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
  .toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}}
</style>
</head>
<body>

<div id="join">
  <div class="card">
    <h1>🏢 월 매출 1억 사무실</h1>
    <p>같은 방 코드를 넣으면 같은 사무실로 들어가요.</p>
    <label>이름</label>
    <input id="jName" maxlength="10" placeholder="예: zy">
    <label>방 코드 <span style="font-weight:400;color:var(--sub)">(둘만 아는 코드)</span></label>
    <div class="row"><input id="jRoom" maxlength="30" placeholder="예: moon-7421"><button class="ghost" id="jRand" style="white-space:nowrap">새 코드</button></div>
    <label>아바타 색</label>
    <div class="swatches" id="jColors"></div>
    <button class="go" id="jGo">입장하기</button>
    <small>서버 없이 두 사람의 브라우저가 직접 연결됩니다. 기록은 각자 브라우저에 저장되고, 접속하면 서로 자동으로 맞춰져요.</small>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <b>🏢 월 매출 1억 사무실</b>
    <span class="clock" id="clock"></span>
    <span class="sp"></span>
    <span class="chip" id="chipConn"><i class="dot"></i><span>연결 준비 중</span></span>
    <button class="ghost" id="btnHistory">📅 기록</button>
  </header>
  <main>
    <div class="stage" id="stage">
      <div id="scene"><canvas id="cv"></canvas></div>
      <section class="seat" id="meSeat">
        <div class="shead">
          <div class="who"><i class="dot"></i><b id="meName"></b><span class="pill" id="mePill"></span></div>
          <div class="net" id="meNet">0:00:00</div>
          <div class="netsub" id="meSub"></div>
          <div class="netsub week" id="meWeek"></div>
        </div>
        <div class="sbody">
          <div class="sec todos">
            <h3>📝 오늘 할 일 <span id="myCount"></span></h3>
            <div class="row" style="margin-bottom:8px"><input id="todoInput" maxlength="80" placeholder="할 일 적고 Enter"><button id="todoAdd">추가</button></div>
            <div class="list"><div id="myTodos"></div><div id="myWrap"></div></div>
          </div>
          <div class="sec">
            <h3>📌 전날 못한 일 <span id="meUndoneDate"></span></h3>
            <div class="list" id="meUndone"></div>
          </div>
          <div class="sec goal">
            <h3>🎯 <b class="gm"></b> 목표</h3>
            <textarea id="goalMine" maxlength="300" placeholder="이번 달 목표를 적어보세요"></textarea>
          </div>
        </div>
      </section>
      <section class="seat" id="pSeat">
        <div class="shead">
          <div class="who"><i class="dot"></i><b id="pName"></b><span class="pill" id="pPill"></span></div>
          <div class="net" id="pNet">0:00:00</div>
          <div class="netsub" id="pSub"></div>
          <div class="netsub week" id="pWeek"></div>
        </div>
        <div class="sbody">
          <div class="sec todos">
            <h3>📝 오늘 할 일 <span id="pCount"></span></h3>
            <div class="list"><div id="partnerTodos"></div><div id="partnerWrap"></div></div>
          </div>
          <div class="sec">
            <h3>📌 전날 못한 일 <span id="pUndoneDate"></span></h3>
            <div class="list" id="pUndone"></div>
          </div>
          <div class="sec goal">
            <h3>🎯 <b class="gm"></b> 목표</h3>
            <div class="list gtext" id="goalP"></div>
          </div>
        </div>
      </section>
      <div class="chat">
        <h3>💬 채팅</h3>
        <div id="chatList"></div>
        <div class="row"><input id="chatInput" maxlength="500" placeholder="메시지 입력 후 Enter"><button id="chatSend">전송</button></div>
      </div>
      <div class="bar">
        <span class="grp"><button id="bMic">🎤 마이크</button><button class="pick" id="bMicPick" title="마이크 선택">▾</button></span>
        <span class="grp"><button id="bCam">📷 카메라</button><button class="pick" id="bCamPick" title="카메라 선택">▾</button></span>
        <div class="menu hidden" id="devMenu"></div>
        <button id="bScreen">🖥️ 화면 공유</button>
        <span class="sep"></span>
        <button id="bStatus">💼 업무 중 ▾</button>
        <div class="menu hidden" id="statusMenu"></div>
        <span class="sep"></span>
        <button id="bIn" class="in">☀️ 출근</button>
        <button id="bOut" class="out">🌙 퇴근</button>
      </div>
    </div>
    <aside class="right">
      <div id="tiles">
        <div class="slot" id="slot-p-cam"><em></em><div class="badges" id="bd-p"></div></div>
        <div class="slot" id="slot-me-cam"><em></em><div class="badges" id="bd-me"></div></div>
        <div class="slot" id="slot-p-screen"><em></em></div>
        <div class="slot" id="slot-me-screen"><em></em></div>
      </div>
    </aside>
  </main>
</div>

<div class="modal hidden" id="outModal">
  <div class="card">
    <h2>🌙 퇴근 체크</h2>
    <p>오늘 끝낸 일에 체크하고, 마무리한 내용을 적어주세요.</p>
    <div id="outTodos"></div>
    <label style="display:block;font-weight:600;margin-top:14px">오늘 마무리한 일</label>
    <textarea id="outText" maxlength="1000" placeholder="예: 상세페이지 시안 완료, 릴스 2개 편집. 내일은 업로드부터."></textarea>
    <div class="foot">
      <button class="ghost hidden" id="outUndo" style="margin-right:auto">퇴근 취소</button>
      <button class="ghost" id="outCancel">닫기</button>
      <button id="outOk">퇴근하기</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="histModal">
  <div class="card">
    <h2>📅 출퇴근 · 할 일 기록</h2>
    <p>날짜별로 두 사람의 기록을 볼 수 있어요.</p>
    <div id="histBody"></div>
    <div class="foot"><button class="ghost" id="histClose">닫기</button></div>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>
<input type="file" id="bgFile" accept="image/*" class="hidden">
<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
};
const COLORS = ['#5b5bd6','#ff7eb6','#22a06b','#f5a524','#3b9eff','#e5484d'];
const pad = n => String(n).padStart(2,'0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = ms => { const m = Math.max(0, Math.floor(ms/60000)); return `${Math.floor(m/60)}시간 ${m%60}분`; };
const hms = ms => { const s = Math.max(0, Math.floor(ms/1000)); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; };
function breakMs(r, now = Date.now()){ const end = r.checkOut || now; return (r.breakMs||0) + (r.breakStart ? Math.max(0, end - r.breakStart) : 0); }
function netMs(r, now = Date.now()){ return r.checkIn ? Math.max(0, (r.checkOut || now) - r.checkIn - breakMs(r, now)) : 0; }
function hash(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for (let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0'); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('#toasts').append(t); setTimeout(()=>t.remove(), 3500); }

/* ───────── 연결 (PeerJS) ───────── */
function setConn(s){ connState = s; renderHeader(); }
function startPeer(s){
  slot = s;
  if (typeof Peer === 'undefined') return setConn('error');
  peer = new Peer(base + '-' + s);
  const p = peer;
  p.on('open', () => { if (p===peer) setConn('waiting'); });
  p.on('connection', c => setupConn(c));
  p.on('call', onCall);
  p.on('disconnected', () => { setTimeout(() => { if (p===peer && !p.destroyed) p.reconnect(); }, 2000); });
  p.on('error', e => {
    if (p !== peer) return;
    if (e.type === 'unavailable-id'){ p.destroy(); setTimeout(() => startPeer(s===1?2:1), s===2?1500:100); }
    else if (e.type !== 'peer-unavailable') { console.warn('peer error', e.type); if (!conn) setConn('error'); }
  });
}
setInterval(() => {            // 2번 자리가 1번 자리로 주기적으로 연결 시도
  if (!peer || slot!==2 || peer.destroyed || peer.disconnected || !peer.open || conn) return;
  try { pending?.close(); } catch {}
  pending = peer.connect(base + '-1', { reliable:true }); setupConn(pending);
}, 3000);
function setupConn(c){
  c.on('open', () => {
    if (conn && conn !== c) { try { conn.close(); } catch {} }
    conn = c; pending = null; lastSeen = Date.now(); partner.online = true; setConn('connected');
    send({ t:'hello', name:me.name, color:me.color, records:Object.values(records), chat:chat.slice(-300) });
    Object.keys(local).forEach(callOut);
  });
  c.on('data', d => { if (c===conn){ lastSeen = Date.now(); handle(d); } });
  c.on('close', () => { if (c===conn) dropConn(); });
  c.on('error', () => {});
}
function dropConn(){
  try { conn?.close(); } catch {}
  conn = null; partner.online = false;
  remote.mic = remote.cam = remote.screen = false;
  ['cam','screen'].forEach(k => removeTile('p-'+k)); $('#remoteAudio').srcObject = null;
  if (partner.name) toast(`${partner.name}님이 자리를 비웠어요`);
  setConn('waiting'); render();
}
function send(m){ if (conn?.open) { try { conn.send(m); } catch {} } }
setInterval(() => { if (!conn) return; send({ t:'ping' }); if (Date.now()-lastSeen > 12000) dropConn(); }, 3000);
addEventListener('beforeunload', () => { send({ t:'bye' }); try { peer?.destroy(); } catch {} });

function handle(d){
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello'){
    const nm = String(d.name||'').slice(0,10);
    if (nm === me.name) toast('두 사람 이름이 같아요. 서로 다른 이름으로 들어와 주세요!');
    const first = partner.name !== nm; partner.name = nm; if (COLORS.includes(d.color)) partner.color = d.color;
    (d.records||[]).forEach(mergeRec); if (mergeChat(d.chat)) renderChat(); save();
    toast(`${nm}님이 들어왔어요 👋`); render();
  } else if (d.t === 'rec'){
    const before = records[d.r?.date+'|'+d.r?.user] || {};
    mergeRec(d.r); save();
    if (d.r?.date === today){
      if (d.r.checkIn && !d.r.checkOut && before.checkIn && statusKey(before) !== statusKey(d.r)){ const s = STATUSES[statusKey(d.r)]; toast(`${s.icon} ${d.r.user}님: ${s.label}`); }
      if (!before.checkIn && d.r.checkIn) toast(`☀️ ${d.r.user}님 출근! (${hm(d.r.checkIn)})`);
      if (!before.checkOut && d.r.checkOut) toast(`🌙 ${d.r.user}님 퇴근! (${hm(d.r.checkOut)})`);
    }
    render();
  } else if (d.t === 'chat'){
    if (mergeChat([d.m])){
      const m = chat.find(c => c.id === d.m.id); save(); renderChat();
      if (document.hidden){ unread++; document.title = `(${unread}) 월 매출 1억 사무실`; }
    }
  }
  else if (d.t === 'stop'){ if (d.kind in remote){ remote[d.kind] = false; renderBadges(); } if (d.kind==='mic') $('#remoteAudio').srcObject = null; else removeTile('p-'+d.kind); }
  else if (d.t === 'bye'){ dropConn(); }
}

const devPref = LS.get('duo-office:devices', {});
async function openDevice(kind){          // 저장해 둔 장치로 열고, 그 장치가 없으면 기본 장치로
  const id = devPref[kind];
  const cons = d => kind==='mic' ? { audio: d ? { deviceId:{ exact:d } } : true }
                                 : { video: Object.assign({ width:{ideal:640}, height:{ideal:400} }, d ? { deviceId:{ exact:d } } : {}) };
  try { return await navigator.mediaDevices.getUserMedia(cons(id)); }
  catch(e){
    if (!id || !['OverconstrainedError','NotFoundError','NotReadableError'].includes(e.name)) throw e;
    delete devPref[kind]; LS.set('duo-office:devices', devPref); toast('선택했던 장치를 열 수 없어 기본 장치로 켰어요');

async function openMenu(kind){

    catch { return toast(kind==='mic' ? '마이크를 찾을 수 없거나 권한이 없어요' : '카메라를 찾을 수 없거나 권한이 없어요'); }

async function toggle(kind){
  if (local[kind]) return stopLocal(kind);
  try {
    const md = navigator.mediaDevices;
    let s = kind==='screen' ? await md.getDisplayMedia({ video:true, audio:true }) : await openDevice(kind);
    if (kind==='cam' && (devPref.bg||'none') !== 'none') s = await startFx(s);
    local[kind] = s;
    s.getVideoTracks().forEach(t => t.onended = () => stopLocal(kind));
    if (kind==='cam') addTile('me-cam', s, me.name+' (나)', true);
    if (kind==='screen') addTile('me-screen', s, '내 화면', true);
    callOut(kind);
  } catch(e){
    if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') toast('장치를 열 수 없어요: ' + e.name);
    else if (kind !== 'screen') toast('브라우저에서 권한을 허용해 주세요');
  }

}
function callOut(kind){
  if (!conn?.open || !local[kind]) return;
  try { calls[kind]?.close(); } catch {}
  calls[kind] = peer.call(conn.peer, local[kind], { metadata:{ kind } });
}
function stopLocal(kind){
  local[kind]?.getTracks().forEach(t => { t.onended=null; t.stop(); });
  if (kind==='cam') stopFx();
  local[kind] = null; try { calls[kind]?.close(); } catch {} delete calls[kind];
  send({ t:'stop', kind }); removeTile('me-'+kind); updateButtons();
}
function onCall(call){
  const kind = call.metadata?.kind;
  call.answer();
  call.on('stream', s => {
    if (kind in remote){ remote[kind] = true; renderBadges(); }
    if (kind==='mic') { $('#remoteAudio').srcObject = s; $('#remoteAudio').play().catch(()=>{}); }
    else if (kind==='cam') addTile('p-cam', s, partner.name||'동료', false);
    else if (kind==='screen') addTile('p-screen', s, (partner.name||'동료')+'의 화면', false);

/* ───────── 카메라 배경 효과 (흐림 / 배경 교체) ───────── */
const MP_VER = '0.10.14', MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const BGS = { none:'효과 없음', blur:'배경 흐리게', blur2:'배경 많이 흐리게', g1:'배경: 보라 노을', g2:'배경: 민트 하늘', g3:'배경: 따뜻한 베이지', g4:'배경: 깔끔한 회색' };
const GRADS = { g1:['#5b5bd6','#ff9ec7'], g2:['#7fd8c4','#d6f0ff'], g3:['#f3e3cf','#e2c4a4'], g4:['#eef0f5','#c9cedd'] };
let segmenter = null, fx = null, bgCanvas = null;
function bgMenuHtml(){
  const cur = devPref.bg || 'none', has = !!localStorage.getItem('duo-office:bgimg');
  const item = (k, label) => `<button data-bg="${k}" class="${k===cur?'cur':''}">${k===cur?'✓ ':''}${label}</button>`;
  return '<b style="margin-top:6px;border-top:1px solid var(--line);padding-top:10px">🖼️ 내 뒤 배경</b>' + Object.entries(BGS).map(([k,v]) => item(k,v)).join('')
    + (has ? item('image', '배경: 내 이미지') : '') + '<button data-bg="upload">＋ 내 이미지 올리기…</button>';
}
async function loadSegmenter(){
  if (segmenter) return segmenter;
  const mp = await import(MP_URL + '/vision_bundle.mjs');
  const files = await mp.FilesetResolver.forVisionTasks(MP_URL + '/wasm');
  const make = delegate => mp.ImageSegmenter.createFromOptions(files, { baseOptions:{ modelAssetPath:MP_MODEL, delegate }, runningMode:'VIDEO', outputCategoryMask:false, outputConfidenceMasks:true });
  try { segmenter = await make('GPU'); } catch { segmenter = await make('CPU'); }
  return segmenter;
}
async function prepareBg(){
  const mode = devPref.bg || 'none'; bgCanvas = null;
  if (GRADS[mode]){
    const c = document.createElement('canvas'); c.width = 640; c.height = 400; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0,0,640,400); gr.addColorStop(0, GRADS[mode][0]); gr.addColorStop(1, GRADS[mode][1]); g.fillStyle = gr; g.fillRect(0,0,640,400);
    bgCanvas = c;
  } else if (mode === 'image'){
    const url = localStorage.getItem('duo-office:bgimg'); if (!url) return;
    const img = new Image(); img.src = url; try { await img.decode(); bgCanvas = img; } catch {}
  }
}
function drawCover(c, img, w, h){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = Math.max(w/iw, h/ih);
  c.drawImage(img, (w-iw*k)/2, (h-ih*k)/2, iw*k, ih*k);
}
async function startFx(raw){          // 카메라 영상에서 사람만 남기고 배경을 바꾼 새 영상을 만든다
  try {
    toast('배경 효과 준비 중…');
    const seg = await loadSegmenter(); await prepareBg();
    const video = document.createElement('video'); video.muted = true; video.playsInline = true; video.srcObject = raw; await video.play();
    const w = video.videoWidth || 640, h = video.videoHeight || 400;
    const mk = (cw, ch) => { const c = document.createElement('canvas'); c.width = cw; c.height = ch; return c; };
    const out = mk(w,h), person = mk(w,h), mask = mk(2,2);
    const octx = out.getContext('2d'), pctx = person.getContext('2d'), mctx = mask.getContext('2d');
    let lastTs = 0;
    const step = () => {
      if (video.readyState < 2) return;
      const ts = Math.max(performance.now(), lastTs + 1); lastTs = ts;
      try {
        seg.segmentForVideo(video, ts, res => {
          const masks = res.confidenceMasks; if (!masks?.length) return;
          const m = masks[masks.length - 1], data = m.getAsFloat32Array();
          if (mask.width !== m.width || mask.height !== m.height){ mask.width = m.width; mask.height = m.height; }
          const img = mctx.createImageData(m.width, m.height), px = img.data;
          for (let i = 0; i < data.length; i++){ const a = (data[i] - 0.35) / 0.3; px[i*4+3] = a <= 0 ? 0 : a >= 1 ? 255 : a*255; }
          mctx.putImageData(img, 0, 0);
          pctx.globalCompositeOperation = 'copy'; pctx.filter = 'blur(2px)'; pctx.drawImage(mask, 0, 0, w, h); pctx.filter = 'none';
          pctx.globalCompositeOperation = 'source-in'; pctx.drawImage(video, 0, 0, w, h);
          const mode = devPref.bg || 'none';
          if (bgCanvas) drawCover(octx, bgCanvas, w, h);
          else if (mode === 'blur' || mode === 'blur2'){ octx.filter = `blur(${mode==='blur'?7:16}px)`; octx.drawImage(video, -24, -24, w+48, h+48); octx.filter = 'none'; }
          else octx.drawImage(video, 0, 0, w, h);
          if (mode !== 'none') octx.drawImage(person, 0, 0);
        });
      } catch(e){ console.warn('segment', e); }
    };
    // 탭이 뒤로 가도 멈추지 않도록 워커 타이머로 프레임을 돌린다
    const worker = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),45)'], { type:'text/javascript' })));
    worker.onmessage = step; step();
    const stream = out.captureStream(22);
    raw.getVideoTracks().forEach(t => t.onended = () => stopLocal('cam'));
    fx = { raw, video, worker, stream, out };
    return stream;
  } catch(e){
    console.warn('fx', e); toast('배경 효과를 불러오지 못해 일반 카메라로 켰어요'); fx = null; return raw;
  }
}
function stopFx(){
  if (!fx) return;
  fx.worker.terminate(); fx.raw.getTracks().forEach(t => { t.onended = null; t.stop(); }); fx.video.srcObject = null; fx = null;
}
async function setBg(mode){
  devPref.bg = mode; LS.set('duo-office:devices', devPref); await prepareBg();
  if (!local.cam) return toast('카메라를 켜면 이 배경이 적용돼요');
  if (!!fx !== (mode !== 'none')){ stopLocal('cam'); await toggle('cam'); }
}
$('#bgFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;

  ctx.font = '700 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  rr(x-tw/2, y-68, tw, 23, 11.5, 'rgba(35,38,58,.88)'); ctx.fillStyle = '#fff'; ctx.fillText(label, x, y-56);
  const r = records[today+'|'+a.name], sk = r && r.checkIn && !r.checkOut ? statusKey(r) : 'work';
  if (sk !== 'work'){
    const s = STATUSES[sk], t = `${s.icon} ${s.label}`, bw = ctx.measureText(t).width + 22;
    rr(x-bw/2, y-98, bw, 26, 13, s.pause ? '#12a594' : '#f5a524'); ctx.fillStyle = '#fff'; ctx.fillText(t, x, y-84.5);
  }
  if (a.say){
    ctx.font = '15px sans-serif';          // 마지막 채팅은 머리 오른쪽 말풍선으로
    const t = fit(a.say.text.replace(/\s+/g,' '), Math.max(70, Math.min(320, SEATS[0].x-78))), bw = ctx.measureText(t).width + 24, bx = x+34, by = y-42;
    rr(bx, by, bw, 32, 12, '#fff', '#cfd3e2');
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(bx+1.5, by+10); ctx.lineTo(bx-8, by+17); ctx.lineTo(bx+1.5, by+23); ctx.fill();
    ctx.strokeStyle = '#cfd3e2'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by+10); ctx.lineTo(bx-8, by+17); ctx.lineTo(bx, by+23); ctx.stroke();
    ctx.fillStyle = '#23263a'; ctx.fillText(t, bx+bw/2, by+16.5);
  }
}
let lastT = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-lastT)/1000); lastT = now;
  if (me.name){
    me.x = SEATS[0].x; me.y = SEATS[0].y; partner.x = SEATS[1].x; partner.y = SEATS[1].y;
    ctx.setTransform(scale,0,0,scale,0,0);
    drawFloor();
    for (const s of SEATS) chair(s.x, s.y+6);
    drawAvatar(me, true);
    if (partner.online && partner.name) drawAvatar(partner, false);
    else drawVacant(partner.x, partner.y, partner.name ? `${partner.name} · 오프라인` : '동료를 기다리는 중…');
    for (const s of SEATS) drawDesk(s.x);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
